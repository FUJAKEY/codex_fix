name: Build Codex binary

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: codex-linux-x64
            archive: codex-linux-x64.tar.gz
          - target: aarch64-unknown-linux-gnu
            artifact: codex-linux-aarch64
            archive: codex-linux-aarch64.tar.gz
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
        working-directory: codex-rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libssl-dev:arm64 \
            pkg-config
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Configure aarch64 build environment
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            codex-rs -> target

      - name: Build codex release binary
        run: cargo build --release -p codex-cli --target ${{ matrix.target }}

      - name: Package binary for npm
        run: |
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/release/codex ../artifacts/
          tar -czf ../${{ matrix.archive }} -C ../artifacts codex

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
